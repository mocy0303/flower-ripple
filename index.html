<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Flower Ripple Art</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; cursor: pointer; user-select: none; -webkit-user-select: none; }
        
        /* 水面のテクスチャ背景 */
        body {
            background-image: url('https://images.unsplash.com/photo-1542314831-068cd1dbfeeb?q=80&w=2940&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
        }

        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        .instruction { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: rgba(255,255,255,0.7); font-size: 14px; letter-spacing: 0.2em; pointer-events: none; z-index: 2; text-align: center; animation: pulse 2s infinite ease-in-out; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.8; } }
    </style>
</head>
<body>

    <div class="instruction">画面を触ってみて</div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        // 物理演算用の水面データ配列
        let r1 = new Float32Array(width * height);
        let r2 = new Float32Array(width * height);
        let flowers = [];

        // 【新機能】実写のお花画像の読み込み
        const flowerImages = [
            'https://i.imgur.com/83p1P9M.png', // 桜
            'https://i.imgur.com/KqC6N5u.png'  // 白いお花
        ].map(src => {
            const img = new Image();
            img.src = src;
            return img;
        });

        // 画面がクリックされたときの処理
        function triggerRipple(clientX, clientY) {
            const x = Math.floor(clientX);
            const y = Math.floor(clientY);

            // 1. 物理演算の波紋の「起点」を作る
            const radius = 6;
            for (let i = -radius; i <= radius; i++) {
                for (let j = -radius; j <= radius; j++) {
                    if (x + i >= 0 && x + i < width && y + j >= 0 && y + j < height) {
                        if (i*i + j*j <= radius*radius) {
                            r1[(y + j) * width + (x + i)] = 1024; // 波の初期高さを少し大きく
                        }
                    }
                }
            }

            // 2. 実写のお花のデータを追加
            flowers.push({
                x: clientX,
                y: clientY,
                imageIndex: Math.floor(Math.random() * flowerImages.length),
                size: Math.random() * 40 + 60, // 60px〜100pxのサイズ
                alpha: 1.0,
                scale: 0.1
            });
        }

        window.addEventListener('mousedown', (e) => triggerRipple(e.clientX, e.clientY));
        window.addEventListener('touchstart', (e) => {
            e.preventDefault();
            triggerRipple(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });

        // メインのループ処理
        function animate() {
            // 背景のクリア（透明にしてCSSの背景水面を見せる）
            ctx.clearRect(0, 0, width, height);

            // 1. お花の描画（実写画像）
            for (let i = flowers.length - 1; i >= 0; i--) {
                let f = flowers[i];
                if (f.scale < 1.0) f.scale += 0.1;
                f.alpha -= 0.003;

                if (f.alpha <= 0) {
                    flowers.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.translate(f.x, f.y);
                ctx.globalAlpha = f.alpha;
                const currentImg = flowerImages[f.imageIndex];
                if (currentImg.complete) {
                    const drawSize = f.size * f.scale;
                    ctx.drawImage(currentImg, -drawSize/2, -drawSize/2, drawSize, drawSize);
                }
                ctx.restore();
            }

            // 2. 波紋の物理演算と描画
            // ※負荷軽減のため間引いて計算
            for (let y = 1; y < height - 1; y += 2) {
                for (let x = 1; x < width - 1; x += 2) {
                    let i = y * width + x;
                    r2[i] = ((r1[i - 1] + r1[i + 1] + r1[i - width] + r1[i + width]) / 2) - r2[i];
                    r2[i] *= 0.95;

                    let shade = r2[i];
                    if (shade > 1 || shade < -1) {
                        ctx.fillStyle = shade > 0 ? `rgba(255,255,255,${Math.min(shade/50, 0.5)})` : `rgba(200,220,255,${Math.min(-shade/60, 0.4)})`;
                        ctx.fillRect(x, y, 3, 3);
                    }
                }
            }

            let temp = r1; r1 = r2; r2 = temp;
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            r1 = new Float32Array(width * height);
            r2 = new Float32Array(width * height);
        });

        animate();
    </script>
</body>
</html>
